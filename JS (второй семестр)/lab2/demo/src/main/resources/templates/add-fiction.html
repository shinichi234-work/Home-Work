<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Художественная литература</title>
    <link href="/webjars/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container">
<h1 class="mt-4">Добавить Худ. литературу</h1>
<form th:object="${fictionBook}" th:action="@{/add-fiction}" method="post">
    <div class="mb-3">
        <label class="form-label">Название:</label>
        <input type="text" th:field="*{title}" class="form-control"/>
        <div th:if="${#fields.hasErrors('title')}" class="text-danger" th:errors="*{title}"></div>
    </div>
    <div class="mb-3">
        <label class="form-label">Автор:</label>
        <input type="text" th:field="*{author}" class="form-control"/>
        <div th:if="${#fields.hasErrors('author')}" class="text-danger" th:errors="*{author}"></div>
    </div>
    <div class="mb-3">
        <label class="form-label">Жанр:</label>
        <input type="text" th:field="*{genre}" class="form-control"/>
        <div th:if="${#fields.hasErrors('genre')}" class="text-danger" th:errors="*{genre}"></div>
    </div>
    <button type="submit" class="btn btn-primary">Добавить Книгу</button>
</form>
<a href="/" class="btn btn-secondary mt-3">Вернуться</a>
</body>
</html>
