<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Список Книг</title>
    <link href="/webjars/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container">
<h1 class="mt-4">Список Книг</h1>
<div class="mb-3">
    <a href="/add-fiction" class="btn btn-primary">Добавить Художественную литерату</a>
    <a href="/add-nonfiction" class="btn btn-primary">Добавить Не Художественную литерату</a>
</div>
<table class="table table-striped">
    <thead>
    <tr>
        <th>Название</th>
        <th>Автор</th>
        <th>Вид</th>
        <th>Детали</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.title}"></td>
        <td th:text="${book.author}"></td>
        <td th:text="${book.class.simpleName == 'FictionBook' ? 'Fiction' : 'Non-Fiction'}"></td>
        <td>
            <a th:href="${book.class.simpleName == 'FictionBook'} ? @{/fiction/{id}(id=${book.id})} : @{/nonfiction/{id}(id=${book.id})}"
               class="btn btn-sm btn-info">Информация</a>
        </td>
        <td>
            <a th:href="${book.class.simpleName == 'FictionBook'} ? @{/edit-fiction/{id}(id=${book.id})} : @{/edit-nonfiction/{id}(id=${book.id})}"
               class="btn btn-sm btn-warning">Редактировать</a>
            <a th:href="${book.class.simpleName == 'FictionBook'} ? @{/delete-fiction/{id}(id=${book.id})} : @{/delete-nonfiction/{id}(id=${book.id})}"
               class="btn btn-sm btn-danger">Удалить</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
